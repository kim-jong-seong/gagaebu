<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <title>가계부</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f7f7f5; --surface: #ffffff; --border: #e8e8e5;
      --text: #1a1a1a; --text-muted: #9a9a95;
      --accent: #3d5afe; --accent-light: #eef0ff;
      --expense: #c0392b; --expense-bg: #fdf0ef;
      --radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    .login-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .login-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }
    .pw-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 6px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      font-family: inherit;
      transition: border-color .15s;
    }
    .pw-input:focus { border-color: var(--accent); background: #fff; }
    .pw-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .15s;
    }
    .pw-btn:hover { opacity: .88; }
    .err-msg {
      font-size: 12px;
      color: var(--expense);
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">mon<span>.</span>ey</div>
  <div class="login-card">
    <p class="login-label">비밀번호를 입력하세요</p>
    <input type="password" id="pwInput" class="pw-input" placeholder="••••••" maxlength="20" />
    <button class="pw-btn" onclick="login()">확인</button>
    <p class="err-msg" id="errMsg"></p>
  </div>
</div>
<script>
  const ENCODED = 'MjAwNzA4';

  if (sessionStorage.getItem('auth')) location.replace('/index.html');

  document.getElementById('pwInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });

  function login() {
    const pw = document.getElementById('pwInput').value;
    if (!pw) return;
    if (btoa(pw) === ENCODED) {
      sessionStorage.setItem('auth', '1');
      location.replace('/index.html');
    } else {
      document.getElementById('errMsg').textContent = '비밀번호가 올바르지 않습니다';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }
</script>
</body>
</html>
