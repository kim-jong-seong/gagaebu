<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통계 — 가계부</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f7f5; --surface: #ffffff; --border: #e8e8e5;
      --text: #1a1a1a; --text-muted: #9a9a95;
      --income: #2d7a4f; --income-bg: #edf7f1;
      --expense: #c0392b; --expense-bg: #fdf0ef;
      --warn: #d68910;
      --accent: #3d5afe; --accent-light: #eef0ff;
      --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 28px 20px; display: flex; flex-direction: column; gap: 32px; position: fixed; top: 0; left: 0; height: 100vh; }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: -.5px; } .logo span { color: var(--accent); }
    nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-weight: 500; transition: all .15s; text-decoration: none; }
    .nav-item:hover { background: var(--bg); color: var(--text); } .nav-item.active { background: var(--accent-light); color: var(--accent); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-footer { margin-top: auto; font-size: 12px; color: var(--text-muted); }
    .main { margin-left: 220px; flex: 1; padding: 36px 40px; max-width: calc(100vw - 220px); }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-title { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
    .page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .period-tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
    .period-tab { padding: 7px 18px; border-radius: 7px; border: none; background: none; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-muted); font-family: inherit; transition: all .15s; }
    .period-tab.active { background: var(--accent); color: #fff; }
    .range-nav { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; }
    .range-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 15px; padding: 1px 3px; border-radius: 4px; }
    .range-btn:hover { background: var(--bg); }
    .range-label { font-weight: 600; font-size: 13px; min-width: 72px; text-align: center; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; box-shadow: var(--shadow); }
    .card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); margin-bottom: 6px; }
    .card-value { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
    .card-value.income { color: var(--income); } .card-value.expense { color: var(--expense); } .card-value.accent { color: var(--accent); }
    .card-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .card-sub.up { color: var(--income); } .card-sub.down { color: var(--expense); }
    .two-col { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
    .left-col, .right-col { display: flex; flex-direction: column; gap: 16px; }
    .sc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); }
    .sc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .sc-title { font-size: 15px; font-weight: 600; }
    .sc-sub { font-size: 12px; color: var(--text-muted); }
    .legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-muted); }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    canvas { display: block; width: 100%; }
    .savings-row { display: flex; flex-direction: column; gap: 6px; }
    .savings-bar-row { display: flex; align-items: center; gap: 10px; }
    .savings-month { font-size: 11px; color: var(--text-muted); min-width: 28px; white-space: nowrap; }
    .savings-bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .savings-bar { height: 100%; border-radius: 99px; }
    .savings-pct { font-size: 11px; font-weight: 600; min-width: 32px; text-align: right; }
    .donut-wrap { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .donut-center { position: absolute; text-align: center; pointer-events: none; }
    .donut-center-value { font-size: 18px; font-weight: 700; letter-spacing: -.5px; }
    .donut-center-label { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .cat-list { display: flex; flex-direction: column; gap: 9px; }
    .cat-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .cat-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .cat-amount { font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .cat-pct { font-size: 11px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; min-width: 30px; text-align: right; }
    .daily-strip { display: flex; gap: 3px; flex-wrap: wrap; }
    .ds-col { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 30px; }
    .ds-bar-col { width: 22px; height: 40px; display: flex; align-items: flex-end; }
    .ds-bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; }
    .ds-num { font-size: 9px; color: var(--text-muted); }
    .ds-col.today .ds-num { color: var(--accent); font-weight: 700; }
    .week-rows { display: flex; flex-direction: column; gap: 10px; }
    .week-row { display: flex; align-items: center; gap: 10px; }
    .week-label { font-size: 11px; color: var(--text-muted); min-width: 36px; white-space: nowrap; }
    .week-bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .week-bar { height: 100%; border-radius: 99px; background: var(--expense); opacity: .8; }
    .week-amount { font-size: 11px; font-weight: 600; min-width: 56px; text-align: right; white-space: nowrap; }
    .mom-grid { display: flex; flex-direction: column; gap: 10px; }
    .mom-row { display: flex; align-items: center; gap: 10px; }
    .mom-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; min-width: 64px; }
    .mom-bars { flex: 1; display: flex; gap: 4px; align-items: flex-end; height: 32px; }
    .mom-bar-item { flex: 1; border-radius: 3px 3px 0 0; min-height: 3px; }
    .mom-bar-item.prev { background: var(--border); }
    .mom-bar-item.curr { background: var(--expense); opacity: .8; }
    .mom-diff { font-size: 11px; font-weight: 600; white-space: nowrap; min-width: 56px; text-align: right; }
    .mom-diff.up { color: var(--expense); } .mom-diff.dn { color: var(--income); }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">mon<span>.</span>ey</div>
    <nav>
      <a class="nav-item" href="index.html"><span class="nav-icon">&#9689;</span> 대시보드</a>
      <a class="nav-item" href="transactions.html"><span class="nav-icon">&#8644;</span> 거래 내역</a>
      <a class="nav-item" href="budget.html"><span class="nav-icon">&#9685;</span> 예산 관리</a>
      <a class="nav-item active" href="stats.html"><span class="nav-icon">&#9783;</span> 통계</a>
      <a class="nav-item" href="settings.html"><span class="nav-icon">&#9881;</span> 설정</a>
    </nav>
    <div class="sidebar-footer">v1.0 &nbsp;·&nbsp; 가계부</div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">통계</div>
        <div class="page-subtitle" id="headerSub"></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="range-nav">
          <button class="range-btn" onclick="changeRange(-1)">&#8249;</button>
          <span class="range-label" id="rangeLabel"></span>
          <button class="range-btn" onclick="changeRange(1)">&#8250;</button>
        </div>
        <div class="period-tabs">
          <button class="period-tab active" onclick="setPeriod(this,'year')">연간</button>
          <button class="period-tab" onclick="setPeriod(this,'month')">월별</button>
        </div>
      </div>
    </div>

    <div class="summary-grid">
      <div class="card"><div class="card-label" id="lIncome">총 수입</div><div class="card-value income" id="sumIncome">—</div><div class="card-sub" id="sumIncomeSub"></div></div>
      <div class="card"><div class="card-label" id="lExpense">총 지출</div><div class="card-value expense" id="sumExpense">—</div><div class="card-sub" id="sumExpenseSub"></div></div>
      <div class="card"><div class="card-label">순 저축</div><div class="card-value income" id="sumSaving">—</div><div class="card-sub" id="sumSavingSub"></div></div>
      <div class="card"><div class="card-label">저축률</div><div class="card-value accent" id="sumRate">—</div><div class="card-sub" id="sumRateSub"></div></div>
    </div>

    <div class="two-col">
      <div class="left-col">
        <div class="sc">
          <div class="sc-header">
            <div class="sc-title" id="trendTitle">월별 수입·지출</div>
            <div class="legend" id="trendLegend">
              <div class="legend-item"><div class="legend-dot" style="background:var(--income)"></div>수입</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--expense)"></div>지출</div>
            </div>
          </div>
          <canvas id="trendChart"></canvas>
        </div>
        <div class="sc" id="secSavings">
          <div class="sc-header">
            <div class="sc-title" id="savingsTitle">월별 저축률</div>
            <div class="sc-sub" id="savingsSub"></div>
          </div>
          <div class="savings-row" id="savingsRow"></div>
        </div>
        <div class="sc" id="secDow" style="display:none">
          <div class="sc-header">
            <div class="sc-title">요일별 평균 지출</div>
          </div>
          <canvas id="dowChart" style="height:80px"></canvas>
        </div>
        <div class="sc" id="secWeeks" style="display:none">
          <div class="sc-header"><div class="sc-title">주차별 지출</div></div>
          <div class="week-rows" id="weekRows"></div>
        </div>
      </div>

      <div class="right-col">
        <div class="sc">
          <div class="sc-header"><div class="sc-title">카테고리별 지출</div></div>
          <div class="donut-wrap" style="height:160px">
            <canvas id="donutChart" style="max-width:160px;max-height:160px"></canvas>
            <div class="donut-center">
              <div class="donut-center-value" id="donutTotal">—</div>
              <div class="donut-center-label">총 지출</div>
            </div>
          </div>
          <div class="cat-list" id="catList"></div>
        </div>
        <div class="sc">
          <div class="sc-header">
            <div class="sc-title" id="momTitle">전월 대비</div>
            <div class="legend">
              <div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div>이전</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--expense);opacity:.8"></div>현재</div>
            </div>
          </div>
          <div class="mom-grid" id="momGrid"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/stats.js"></script>
</body>
</html>
