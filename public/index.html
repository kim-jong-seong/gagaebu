<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="/js/auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <title>가계부</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f7f7f5; --surface: #ffffff; --border: #e8e8e5;
      --text: #1a1a1a; --text-muted: #9a9a95;
      --income: #2d7a4f; --income-bg: #edf7f1;
      --expense: #c0392b; --expense-bg: #fdf0ef;
      --accent: #3d5afe; --accent-light: #eef0ff;
      --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 28px 20px; display: flex; flex-direction: column; gap: 32px; position: fixed; top: 0; left: 0; height: 100vh; }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
    .logo span { color: var(--accent); }
    nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-weight: 500; transition: all .15s; text-decoration: none; }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: var(--accent-light); color: var(--accent); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-footer { margin-top: auto; font-size: 12px; color: var(--text-muted); }
    .main { margin-left: 220px; flex: 1; padding: 36px 40px; max-width: calc(100vw - 220px); }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .month-nav { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 16px; }
    .month-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
    .month-btn:hover { background: var(--bg); color: var(--text); }
    .month-label { font-weight: 600; font-size: 14px; min-width: 80px; text-align: center; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow); }
    .card-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px; }
    .card-amount { font-size: 26px; font-weight: 700; letter-spacing: -1px; }
    .card-amount.income { color: var(--income); }
    .card-amount.expense { color: var(--expense); }
    .card-amount.balance { color: var(--text); }
    .card-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .content-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .section-title { font-size: 15px; font-weight: 600; }
    .filter-tabs { display: flex; gap: 4px; }
    .filter-tab { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: none; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text-muted); transition: all .15s; }
    .filter-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .transaction-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .transaction-date-group { border-bottom: 1px solid var(--border); }
    .transaction-date-group:last-child { border-bottom: none; }
    .date-header { padding: 10px 20px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); background: var(--bg); text-transform: uppercase; letter-spacing: 0.3px; }
    .transaction-item { display: flex; align-items: center; padding: 14px 20px; gap: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
    .transaction-item:last-child { border-bottom: none; }
    .transaction-item:hover { background: var(--bg); }
    .tx-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .tx-info { flex: 1; min-width: 0; }
    .tx-name { font-weight: 500; font-size: 13px; }
    .tx-category { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .tx-amount { font-weight: 600; font-size: 14px; white-space: nowrap; }
    .tx-amount.income { color: var(--income); }
    .tx-amount.expense { color: var(--expense); }
    .add-panel-overlay { position: sticky; top: 36px; }
    .add-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    .add-panel .section-title { margin-bottom: 20px; }
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
    .type-btn { padding: 10px; border: none; background: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; color: var(--text-muted); font-family: inherit; }
    .type-btn.income.active { background: var(--income-bg); color: var(--income); }
    .type-btn.expense.active { background: var(--expense-bg); color: var(--expense); }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: var(--bg); outline: none; transition: border-color .15s; font-family: inherit; }
    .form-control:focus { border-color: var(--accent); background: #fff; }
    input[type="date"].form-control { -webkit-appearance: none; appearance: none; min-height: 42px; line-height: normal; color: var(--text); }
    .amount-input-wrap { position: relative; }
    .amount-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; }
    .amount-input-wrap .form-control { padding-left: 28px; }
    .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .cat-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; font-size: 11px; color: var(--text-muted); transition: all .15s; font-family: inherit; }
    .cat-btn .cat-icon { font-size: 16px; }
    .cat-btn.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .submit-btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: opacity .15s; font-family: inherit; }
    .submit-btn:hover { opacity: .88; }
    .chart-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
    #monthChart { display: block; width: 100%; margin-top: 16px; }
    .breakdown-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .breakdown-item { display: flex; align-items: center; gap: 10px; }
    .breakdown-bar-wrap { flex: 1; height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .breakdown-bar { height: 100%; border-radius: 99px; }
    .breakdown-name { font-size: 12px; font-weight: 500; min-width: 36px; }
    .breakdown-amount { font-size: 11px; color: var(--text-muted); min-width: 70px; text-align: right; white-space: nowrap; }
    .breakdown-icon { font-size: 15px; }
    .empty-state { padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; opacity: 0; transition: all .25s; pointer-events: none; z-index: 200; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .add-btn { display: flex; align-items: center; gap: 6px; padding: 9px 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; font-family: inherit; white-space: nowrap; }
    .add-btn:hover { opacity: .88; }
    .mobile-add-btn { display: none; }
    .add-panel-close { display: none; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); line-height: 1; }
    .add-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    /* add-panel-overlay: desktop에서는 sticky 래퍼(위에서 정의됨). 모바일에서만 오버레이로 동작 */
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }

    /* ── 수정 모달 ───────────────────────────────── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius); padding: 28px; width: 400px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,.12); animation: mIn .18s ease; }
    @keyframes mIn { from { opacity:0; transform: scale(.96) translateY(8px); } to { opacity:1; transform: none; } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); line-height: 1; }
    .modal .type-toggle { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
    .type-btn-m { padding: 10px; border: none; background: none; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: all .15s; font-family: inherit; }
    .type-btn-m.expense.active { background: var(--expense-bg); color: var(--expense); }
    .type-btn-m.income.active { background: var(--income-bg); color: var(--income); }
    .modal .form-group { margin-bottom: 14px; }
    .modal .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
    .modal .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: var(--bg); outline: none; font-family: inherit; transition: border-color .15s; }
    .modal .form-control:focus { border-color: var(--accent); background: #fff; }
    .modal input[type="date"].form-control { -webkit-appearance: none; appearance: none; min-height: 42px; line-height: normal; color: var(--text); }
    .amount-wrap { position: relative; }
    .amount-wrap .amount-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; }
    .amount-wrap .form-control { padding-left: 28px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal .submit-btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity .15s; margin-top: 4px; }
    .modal .submit-btn:hover { opacity: .88; }

    /* ── 하단 탭바 ───────────────────────────────── */
    .bottom-tab-bar { display: none; position: fixed; bottom: 0; left: 0; width: 100vw; height: 76px; padding-bottom: 16px; background: var(--surface); border-top: 1px solid var(--border); z-index: 9999; flex-direction: row; }
    .bottom-tab { flex: 1 1 0px; min-width: 0; max-width: 20%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--text-muted); font-size: 10px; font-weight: 500; white-space: nowrap; transition: color .15s; }
    .bottom-tab.active { color: var(--accent); }
    .bottom-tab-icon { font-size: 20px; line-height: 1; }

    /* ── 모바일 ──────────────────────────────────── */
    @media (max-width: 767px) {
      .bottom-tab-bar { display: flex; }
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 20px 16px 92px; max-width: 100%; }
      .page-header { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 20px; }
      .page-header > div:first-child { flex: 1; }
      .page-title { font-size: 18px; }
      .mobile-add-btn { display: flex; }
      .month-nav { width: 100%; justify-content: space-between; }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
      .summary-grid > .card:last-child { grid-column: 1 / -1; }
      .card-amount { font-size: 20px; }
      .content-grid { grid-template-columns: 1fr; }
      .add-panel-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100; }
      .add-panel-overlay.open { display: flex; align-items: flex-end; padding-bottom: 76px; }
      .add-panel { display: none; width: 100%; border-radius: 16px 16px 0 0; max-height: calc(85vh - 76px); overflow-y: auto; padding-bottom: 24px; }
      .add-panel .form-group { overflow: hidden; }
      .add-panel .form-control { width: 100%; min-width: 0; box-sizing: border-box; }
      .add-panel.open { display: block; animation: slideUp .25s ease; }
      .add-panel.closing { animation: slideDown .25s ease; }
      .add-panel-close { display: block; }
      .toast { bottom: 92px; }
      .modal-overlay { align-items: flex-end; padding-bottom: 76px; }
      .modal { width: 100% !important; max-width: 100% !important; border-radius: 16px 16px 0 0; animation: slideUp .25s ease; }
      .modal.closing { animation: slideDown .25s ease; }
      .form-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .form-row .form-group { min-width: 0; overflow: hidden; }
      .modal .form-control { width: 100%; min-width: 0; box-sizing: border-box; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">mon<span>.</span>ey</div>
    <nav>
      <a class="nav-item active" href="index.html"><span class="nav-icon"><svg width="1em" height="1em" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg></span> 대시보드</a>
      <a class="nav-item" href="transactions.html"><span class="nav-icon"><svg width="1em" height="1em" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v14M2 14l3 3 3-3"/><path d="M15 17V3M12 6l3-3 3 3"/></svg></span> 거래 내역</a>
      <a class="nav-item" href="budget.html"><span class="nav-icon"><svg width="1em" height="1em" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="5" width="18" height="12" rx="2"/><path d="M1 9h18"/><path d="M5 13h3M14 13h1"/></svg></span> 예산 관리</a>
      <a class="nav-item" href="stats.html"><span class="nav-icon"><svg width="1em" height="1em" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17h16"/><rect x="3" y="10" width="4" height="7" rx="0.5"/><rect x="8" y="6" width="4" height="11" rx="0.5"/><rect x="13" y="3" width="4" height="14" rx="0.5"/></svg></span> 통계</a>
      <a class="nav-item" href="settings.html"><span class="nav-icon"><svg width="1em" height="1em" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="5" x2="6" y2="5"/><circle cx="8.5" cy="5" r="2.5" fill="var(--surface)"/><line x1="11" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="11" y2="10"/><circle cx="13.5" cy="10" r="2.5" fill="var(--surface)"/><line x1="16" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="6" y2="15"/><circle cx="8.5" cy="15" r="2.5" fill="var(--surface)"/><line x1="11" y1="15" x2="17" y2="15"/></svg></span> 설정</a>
    </nav>
    <div class="sidebar-footer">v1.0 &nbsp;·&nbsp; 가계부</div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">대시보드</div>
        <div class="page-subtitle" id="pageSubtitle">불러오는 중...</div>
      </div>
      <button class="mobile-add-btn add-btn" onclick="openAddPanel()">+ 거래 추가</button>
      <div class="month-nav">
        <button class="month-btn" onclick="changeMonth(-1)">&#8249;</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="month-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
    </div>

    <div class="summary-grid">
      <div class="card">
        <div class="card-label">이번 달 수입</div>
        <div class="card-amount income" id="cardIncome">—</div>
        <div class="card-sub" id="cardIncomeSub"></div>
      </div>
      <div class="card">
        <div class="card-label">이번 달 지출</div>
        <div class="card-amount expense" id="cardExpense">—</div>
        <div class="card-sub" id="cardExpenseSub"></div>
      </div>
      <div class="card">
        <div class="card-label">잔액</div>
        <div class="card-amount balance" id="cardBalance">—</div>
        <div class="card-sub" id="cardBalanceSub"></div>
      </div>
    </div>

    <div class="content-grid">
      <div>
        <div class="chart-section">
          <div class="section-header">
            <div class="section-title">월별 흐름</div>
            <div style="display:flex;gap:12px;font-size:11px;color:var(--text-muted)">
              <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--income);opacity:.7;display:inline-block"></span>수입</span>
              <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--expense);opacity:.7;display:inline-block"></span>지출</span>
            </div>
          </div>
          <canvas id="monthChart"></canvas>
        </div>

        <div class="chart-section">
          <div class="section-header">
            <div class="section-title">주차별 흐름 <span id="weekChartLabel" style="font-size:12px;font-weight:400;color:var(--text-muted)"></span></div>
            <div style="display:flex;gap:12px;font-size:11px;color:var(--text-muted)">
              <span style="display:flex;align-items:center;gap:5px"><span style="width:14px;border-top:2px solid var(--income);opacity:.8;display:inline-block"></span>수입</span>
              <span style="display:flex;align-items:center;gap:4px"><span style="width:14px;border-top:2px solid var(--expense);opacity:.8;display:inline-block"></span>지출</span>
            </div>
          </div>
          <canvas id="weekChart"></canvas>
          <div id="weekSummary" style="display:flex;gap:0;margin-top:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden"></div>
        </div>

        <div class="chart-section" style="margin-bottom:20px">
          <div class="section-header">
            <div class="section-title">카테고리별 지출</div>
          </div>
          <div class="breakdown-list" id="breakdownList"></div>
        </div>

        <div>
          <div class="section-header">
            <div class="section-title">최근 거래</div>
            <div class="filter-tabs">
              <button class="filter-tab active" onclick="setTxFilter(this,'all')">전체</button>
              <button class="filter-tab" onclick="setTxFilter(this,'income')">수입</button>
              <button class="filter-tab" onclick="setTxFilter(this,'expense')">지출</button>
            </div>
          </div>
          <div class="transaction-list" id="recentTxList"></div>
        </div>
      </div>

      <div class="add-panel-overlay" id="addPanelOverlay" onmousedown="handleOverlayMouseDown(event)" onclick="handleOverlayClick(event)">
        <div class="add-panel">
          <div class="add-panel-header">
            <div class="section-title" style="margin-bottom:0">거래 추가</div>
            <button class="add-panel-close" onclick="closeAddPanel()">&#215;</button>
          </div>
          <div class="type-toggle">
            <button class="type-btn expense active" id="btnExpense" onclick="setType('expense')">지출</button>
            <button class="type-btn income" id="btnIncome" onclick="setType('income')">수입</button>
          </div>
          <div id="defaultIncomeBtn" style="display:none;margin-bottom:14px">

<script>
var _overlayMouseDownTarget = null;
function handleOverlayMouseDown(e) { _overlayMouseDownTarget = e.target; }
function handleOverlayClick(e) { if (_overlayMouseDownTarget === e.currentTarget) closeAddPanel(); }
function openAddPanel() {
  var overlay = document.getElementById('addPanelOverlay');
  var panel = overlay.querySelector('.add-panel');
  overlay.classList.add('open');
  panel.classList.add('open');
}
function closeAddPanel() {
  var overlay = document.getElementById('addPanelOverlay');
  var panel = overlay.querySelector('.add-panel');
  if (!overlay.classList.contains('open')) return;
  panel.classList.add('closing');
  setTimeout(function() {
    overlay.classList.remove('open');
    panel.classList.remove('open', 'closing');
  }, 240);
}
</script>
